name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly supply-chain audit (Mondays 06:00 UTC) — backs the claim in SECURITY.md
    - cron: "0 6 * * 1"

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check aion_nexus server tests scripts examples

      - name: Smoke tests (no checkpoint required)
        run: pytest tests/test_smoke.py -v --tb=short

      - name: Few-shot tests
        run: pytest tests/test_few_shot.py -v --tb=short

      - name: Full test suite with coverage gate
        run: pytest tests/ --cov=aion_nexus --cov=server --cov-report=term-missing --cov-fail-under=70

  build-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

  docker-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: aion-nexus:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container (/health responds)
        # No checkpoint mounted: /health is expected to answer (status may be
        # "down" without a checkpoint) — we assert the server is up and serving.
        run: |
          docker run -d --rm --name aion-nexus-ci -p 8080:8080 aion-nexus:ci-${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
              echo "Health endpoint responded."
              curl -s http://localhost:8080/health
              docker stop aion-nexus-ci
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy in 60s. Logs:"
          docker logs aion-nexus-ci
          docker stop aion-nexus-ci
          exit 1

  supply-chain-audit:
    # Runs weekly on the cron trigger (and can be invoked on push to main).
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies + audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run supply-chain audit (CVEs + license allowlist)
        run: python -m scripts.audit_supply_chain --strict

      - name: Run pip-audit (raw report)
        run: pip-audit
