[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-nexus"
dynamic = ["version"]
description = "Production bearing-fault diagnosis from raw vibration signals"
authors = [{name = "Daniel Culotta", email = "daniel.culotta@gmail.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "predictive-maintenance",
    "bearing-fault-diagnosis",
    "vibration-analysis",
    "deep-learning",
    "industrial-iot",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<3.0.0",
    "scipy>=1.10.0,<2.0.0",  # required for HP-Butterworth filter in preprocessing; without it the silent fallback degrades FEMTO F1 0.884 -> 0.279
    "cryptography>=43,<48",  # Ed25519 asymmetric signing for aion_nexus.verify; <48 is the next un-tested major (we ship/test 47.x)
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20.0,<1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
]
onnx = [
    "onnx>=1.16.0",
    "onnxruntime>=1.17.0",
]

[project.urls]
Homepage = "https://github.com/Dan23RR/aion-nexus"
Documentation = "https://github.com/Dan23RR/aion-nexus/blob/main/README.md"
"Model Card" = "https://github.com/Dan23RR/aion-nexus/blob/main/MODEL_CARD.md"
Performance = "https://github.com/Dan23RR/aion-nexus/blob/main/PERFORMANCE_BENCHMARKS.md"
Changelog = "https://github.com/Dan23RR/aion-nexus/blob/main/CHANGELOG.md"

[project.scripts]
aion-verify = "scripts.verify_checkpoint:main"
aion-benchmark = "scripts.benchmark_inference:main"

[tool.setuptools.packages.find]
# "scripts*" is required: the console entry points above import scripts.* modules.
include = ["aion_nexus*", "server*", "scripts*"]

[tool.setuptools.package-data]
aion_nexus = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "aion_nexus.version.__version__"}  # single source of truth

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["aion_nexus", "server"]
branch = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Cover the whole repo: package, server, scripts, tests, examples.
include = ["pyproject.toml", "aion_nexus/**/*.py", "server/**/*.py", "scripts/**/*.py", "tests/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A"]
ignore = ["E501"]
