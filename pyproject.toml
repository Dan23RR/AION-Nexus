[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-nexus"
dynamic = ["version"]
description = "Production bearing-fault diagnosis from raw vibration signals"
authors = [{name = "Daniel Culotta", email = "daniel.culotta@gmail.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "predictive-maintenance",
    "bearing-fault-diagnosis",
    "vibration-analysis",
    "deep-learning",
    "industrial-iot",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<3.0.0",
    "scipy>=1.10.0,<2.0.0",  # required for HP-Butterworth filter in preprocessing; without it the silent fallback degrades FEMTO F1 0.884 -> 0.279
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
]
onnx = [
    "onnx>=1.16.0",
    "onnxruntime>=1.17.0",
]

[project.urls]
Documentation = "./README.md"
"Model Card" = "./MODEL_CARD.md"
Performance = "./PERFORMANCE_BENCHMARKS.md"

[project.scripts]
aion-verify = "scripts.verify_checkpoint:main"
aion-benchmark = "scripts.benchmark_inference:main"

[tool.setuptools.packages.find]
include = ["aion_nexus*", "server*"]

[tool.setuptools.dynamic]
version = {attr = "aion_nexus.version.__version__"}  # single source of truth

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A"]
ignore = ["E501"]
