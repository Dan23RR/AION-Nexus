services:
  aion-nexus:
    build: .
    image: aion-nexus:2.2.0
    container_name: aion-nexus
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AION_DEVICE: cpu
      AION_CHECKPOINT: /app/checkpoints/aion_nexus_v1.pth
      # Optional hardening (see docs/api_reference.md):
      # AION_API_KEY: change-me            # enables X-API-Key auth (/health stays open)
      # AION_MAX_BODY_BYTES: "10485760"    # request body cap, default 10 MB -> 413
      # AION_CORS_ORIGINS: ""              # comma-separated allowed origins (default: no CORS)
      # AION_LOG_JSON: "1"                 # structured JSON logs with request_id
    volumes:
      - ./checkpoints:/app/checkpoints:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
