name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check aion_nexus server tests scripts examples

      - name: Smoke tests (no checkpoint required)
        run: pytest tests/test_smoke.py -v --tb=short

      - name: Few-shot tests
        run: pytest tests/test_few_shot.py -v --tb=short

      - name: Coverage report
        run: pytest --cov=aion_nexus --cov-report=term-missing tests/

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: aion-nexus:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
